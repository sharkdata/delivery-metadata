[project]
name = "shark-metadata"
version = "2025.1.0"
authors = [
    {name="Mikael Hedblom", email="mikael.hedblom@smhi.se"},
    {name = "Lena Viktorsson", email = " lena.viktorsson@smhi.se"},
    {name = "Jonatan Skogsfors", email = "jonatan.skogsfors@smhi.se"},
]
dependencies = [
    "click>=8.3.0",
    "nodc-codes",
    "pyyaml>=6.0.3",
]
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}


[project.scripts]
metadata-from-package = "shark_metadata.metadata_from_package:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "polars>=1.34.0",
]

[tool.uv]
package = true

[tool.uv.sources]
nodc-codes = { git = "https://github.com/nodc-sweden/nodc-codes/", tag = "v2.0.0" }


[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "F",  # pyflakes
    "E", # pycodestyle: error
    "W",  # pycodestyle: warning
    "I",  # isort: unsorted-imports
    "RUF"  # Ruff-specific rules
]

per-file-ignores."__init__.py" = ["F401"]
